<header class="linkedin-header">
  <div class="header-container">
    
    <!-- Left Section: Logo & Search -->
    <div class="left-nav-group">
      <div class="brand-icon-logo">in</div>
      
      <div class="search-wrapper">
        <span class="glass-icon-anchor">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
        <input type="text" placeholder="Search" class="search-input-field" />
      </div>
    </div>

    <!-- Right Section: Navigation Chains -->
    <div class="right-nav-group">
      
      <!-- Primary Communication Links -->
      <nav class="primary-links-shelf">
        <button 
          *ngFor="let item of navItems" 
          class="nav-item-btn"
          [class.active-state]="item.isActive"
        >
          <div class="icon-canvas-box">
            <span *ngIf="item.badge" class="badge-node">{{ item.badge }}</span>
            <ng-container [ngSwitch]="item.icon">
              <svg *ngSwitchCase="'home'" fill="currentColor" viewBox="0 0 24 24"><path d="M23 9v2h-2v10a1 1 0 01-1 1h-4v-6h-4v6H4a1 1 0 01-1-1V11H1V9L11 2z"/></svg>
              <svg *ngSwitchCase="'users'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <svg *ngSwitchCase="'briefcase'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              <svg *ngSwitchCase="'message-square'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <svg *ngSwitchCase="'bell'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </ng-container>
          </div>
          <span class="label-text-node">{{ item.label }}</span>
        </button>

        <!-- User Me Node -->
        <button class="nav-item-btn">
          <div class="icon-canvas-box">
            <img src="https://unsplash.com" class="profile-avatar-thumb" alt="Me" />
          </div>
          <span class="label-text-node">
            Me 
            <svg class="arrow-down-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </span>
        </button>
      </nav>

      <!-- Business Application Context Elements -->
      <div class="premium-links-shelf">
        <button class="nav-item-btn">
          <div class="icon-canvas-box">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </div>
          <span class="label-text-node">
            For Business 
            <svg class="arrow-down-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </span>
        </button>

        <button class="nav-item-btn">
          <div class="icon-canvas-box">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
          </div>
          <span class="label-text-node">Learning</span>
        </button>
      </div>

    </div>
  </div>
</header>
