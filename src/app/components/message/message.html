<div class="linkedin-chat-drawer" [class.expanded]="isExpanded">
  
  <!-- Header Bar (Matches your image layout) -->
  <div class="chat-header" (click)="toggleDrawer()">
    <div class="header-left">
      <div class="avatar-container">
        <img [src]="user.avatarUrl" [alt]="user.name" class="avatar-img" />
        <span *ngIf="user.isOnline" class="status-indicator online"></span>
      </div>
      <span class="header-title">Messaging</span>
    </div>

    <div class="header-right">
      <!-- More Options Button (...) -->
      <button class="icon-btn" (click)="onMoreOptions($event)" aria-label="More options">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M5 10a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm7 0a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm7 0a2 2 0 1 1-2 2 2 2 0 0 1 2-2z"/>
        </svg>
      </button>

      <!-- New Message Button (Square with Pencil) -->
      <button class="icon-btn" (click)="onNewMessage($event)" aria-label="Compose message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>

      <!-- Toggle Chevron Up/Down -->
      <button class="icon-btn toggle-arrow" aria-label="Toggle chat window">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="18 15 12 9 6 15" *ngIf="!isExpanded"></polyline>
          <polyline points="6 9 12 15 18 9" *ngIf="isExpanded"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Expandable Content Area -->
  <div class="chat-content" *ngIf="isExpanded">
    <div class="search-box">
      <input type="text" placeholder="Search messages..." />
    </div>
    <div class="message-list-placeholder">
      <p>No new messages</p>
    </div>
  </div>
</div>
